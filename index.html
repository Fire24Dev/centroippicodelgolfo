<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Ippico del Golfo | Eccellenza Equestre</title>
    <style>
        /* Reset e Font */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden; /* Mantiene la pagina fissa come una cartolina */
        }

        /* Sfondo Full Screen con Overlay Scuro per leggere meglio */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('IMG_20251206_105321670_MFNR.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Centratura Totale con Flexbox */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra verticalmente */
            align-items: center;     /* Centra orizzontalmente */
            text-align: center;
        }

        /* Titolo Elegante */
        .title-container {
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 span {
            display: block;
            font-size: 0.4em;
            letter-spacing: 10px;
            font-weight: 300;
            margin-top: 10px;
            color: #d4af37; /* Oro */
        }

        /* Bottoni Moderni */
        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Effetto Vetro */
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 50px; /* Arrotondati */
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #d4af37;
            border-color: #d4af37;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Tag Località in basso */
        .location-tag {
            position: absolute;
            bottom: 40px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 10px;
        }

    </style>
</head>
<body>

    <div class="hero">
        <div class="title-container">
            <h1>Centro Ippico <span>Del Golfo</span></h1>
        </div>
        
        <div class="nav-buttons">
            <a href="chi-siamo.html" class="btn">Chi Siamo</a>
            <a href="corsi.html" class="btn">I Corsi</a>
            <a href="contatti.html" class="btn">Contatti</a>
        </div>

        <div class="location-tag">
            Genova Nervi • Sant'Ilario
        </div>
    </div>

</body>
</html>
